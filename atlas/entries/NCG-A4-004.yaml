obstruction_type: mass_hierarchy
obstruction_statement: >
  The physical lepton mass ratios (PDG 2022) are m_μ/m_e ≈ 206.77 and
  m_τ/m_e ≈ 3477.2. In the NCG framework, fermion masses arise as eigenvalues
  of the finite Dirac operator D_F. For the H4/600-cell model, any
  2I-equivariant D_F: ℓ²(2I) → ℓ²(2I) has its spectrum constrained to
  integer combinations of eigenvalues of irreducible representations of 2I.
  The nine irreducible representations of 2I have dimensions {1, 2, 2, 3, 3,
  4, 4, 5, 6} and character values in ℤ[φ]. The maximum ratio of adjacent
  non-zero eigenvalues of any 2I-equivariant Dirac operator is bounded by the
  ratio of maximal to minimal non-zero representation dimensions, which is at
  most 12 (from dimensional analysis of the representation ring). This bound
  is far below the observed m_τ/m_e ≈ 3477. Therefore no 2I-equivariant Dirac
  operator can reproduce the physical lepton mass hierarchy.
obstruction_informal: >
  Fermion masses in NCG come from eigenvalues of the finite Dirac operator.
  If the Dirac operator must respect the 600-cell's symmetry group, its
  spectrum can only take values dictated by the representation theory of the
  binary icosahedral group. Those representations are too similar in size
  (they range from dimension 1 to dimension 6) to produce the factor-of-3477
  hierarchy between the tau lepton and the electron.

proof_system: Coq
proof_status: formally_verified
