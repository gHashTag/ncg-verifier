proof_notes: >
  The proof bounds the ratio of extreme representation dimensions of 2I and
  uses interval arithmetic to show this bound is incompatible with the
  observed lepton ratios. The argument is self-contained within CorePhi.v and
  the representation-theoretic structure encoded in the Coq definitions.

