obstruction_type: sigma_field
obstruction_statement: >
  In the Chamseddine–Connes NCG Standard Model, the σ-field arises as a
  unimodular inner fluctuation of the Dirac operator: D_A = D + A + JAJ^{-1}
  where A is a Hermitian fluctuation. The unimodularity constraint on A forces
  a specific scalar degree of freedom (the σ-field) that is distinct from the
  Higgs. In the H4/600-cell triple, the space of 2I-equivariant self-adjoint
  operators on ℓ²(2I) is spanned by elements of the group algebra, and the
  degree-2 Coxeter invariant of H4 (the quadratic polynomial in root
  coordinates) is constant on each 2I-orbit. There is therefore no equivariant
  scalar fluctuation that can split the unimodular condition in the way
  required for the σ-field. Formally: dim(EndEquiv_{2I}(ℓ²(2I))_{σ-type}) = 0,
  where the "σ-type" refers to the representation type that would support a
  unimodular-split scalar.
obstruction_informal: >
  The NCG σ-field is a specific scalar field that emerges when one removes
  the unimodularity constraint on gauge fluctuations of the Dirac operator.
  In the H4/600-cell model, the only invariant scalars come from the Coxeter
  ring, and the degree-2 invariant is trivial on each 2I-orbit. There is no
  room for the required non-trivial scalar splitting: the model is too
  symmetric to host the σ-field.

