maintainer: "trinity-s3ai contributors"

algebra: "J₃(𝕆)"  # the exceptional Jordan algebra of 3×3 Hermitian matrices over the octonions 𝕆; non-associative, 27-dimensional real vector space — used not as a C*-algebra in the Connes sense but as the coordinate algebra of "Jordan geometry"
algebra_type: jordan_algebra
hilbert_space_description: >
  Representation space of J₃(𝕆) as a Jordan module; the relevant Hilbert
  space for particle physics would be the complexification of the minimal
  faithful module.
dirac_operator_description: >
  No standard spectral triple Dirac is yet defined; the Farnsworth (2025)
  construction gives a 2-point geometry for F₄ × F₄ as a proof of concept
  (DOI:10.48550/arXiv.2503.10744).
real_structure_J: >
  Not yet defined in full generality; the Jordan structure provides a notion
  of "real involution" via the Jordan identity but the spectral triple axioms
  are not all satisfied.
