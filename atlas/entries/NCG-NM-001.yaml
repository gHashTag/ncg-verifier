KO_dimension: null  # Unknown / not applicable in standard sense; TODO: not specified in V3 source

obstruction_type: other
obstruction_statement: >
  Candidate claim: The exceptional Jordan algebra J₃(𝕆) is non-associative;
  the standard axioms of a Connes spectral triple require an associative
  (C*-)algebra A. Therefore no spectral triple in the strict Connes sense can
  have A = J₃(𝕆). Any "Jordan geometry" spectral triple based on J₃(𝕆) must
  either (a) weaken the associativity axiom, thereby leaving the standard
  Connes framework, or (b) replace J₃(𝕆) with an associative envelope that
  loses the exceptional structure. In either case, the specific
  phenomenological benefits attributed to the exceptional algebra — in
  particular the connection to three fermion generations and the triality of
  SO(8) — are not derivable within the Connes spectral triple framework as
  currently formulated.
obstruction_informal: >
  Connes' formalism requires an associative algebra at its foundation. The
  exceptional Jordan algebra is not associative, so it cannot play the role of
  the algebra A in a standard spectral triple. Any construction that uses it
  must break out of the standard framework, and once you do that, the no-go
  theorems for standard spectral triples no longer apply — but neither do many
  of the structural theorems that make NCG tractable.

proof_system: none
proof_status: candidate
proof_notes: >
  The non-associativity of J₃(𝕆) is a classical fact. The claim that this
  prevents standard spectral triple formation is straightforward but requires
  careful statement because of the distinction between the Jordan algebra
  itself and its associative envelope. Boyle (2020, arXiv:2006.16265) and
  Boyle-Farnsworth (2019, DOI:10.1088/1367-2630/ab9709) explicitly note this
  distinction and advocate for "Jordan geometry" as a generalization.
  Farnsworth (2025, DOI:10.48550/arXiv.2503.10744) constructed the first
  concrete 2-point finite Jordan geometry. A formal obstruction proof would
  close the question of whether J₃(𝕆) can be embedded in a standard
  spectral triple.

