comparison_with_other_atlas_entries: >
  Shares first_order obstruction type with the general NCG-SM when the
  first-order condition is imposed. The NCG-DI-001 entry addresses a related
  but distinct issue of dimensional reduction. Gauge unification constraints
  are shared with any spectral action model. The σ-field tension is analogous
  to NCG-A4-002.

