comparison_with_other_atlas_entries: >
  The mass hierarchy obstruction type is shared with NCG-A4-004, but the
  mechanism is completely different. NCG-A4-004 uses group representation
  theory (2I); NCG-DI-001 uses the spectral truncation bound on Dirac
  eigenvalue ratios. Together they suggest that mass hierarchy is a systematic
  challenge for the NCG approach across different model types.

