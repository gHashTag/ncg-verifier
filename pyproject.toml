[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ncg-verifier"
version = "0.1.0-alpha"
description = "Formal verifier for noncommutative-geometry spectral triples, with anti-numerology gate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "trinity-s3ai contributors" },
]
keywords = [
  "noncommutative geometry",
  "formal verification",
  "spectral triple",
  "Coq",
  "Lean 4",
  "Standard Model",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "mypy>=1.0",
  "ruff>=0.4",
]
full = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
]

[project.scripts]
ncg-verifier = "ncg_verifier.cli:main"

[project.urls]
Homepage = "https://github.com/gHashTag/ncg-verifier"
Repository = "https://github.com/gHashTag/ncg-verifier"
Issues = "https://github.com/gHashTag/ncg-verifier/issues"
"Source (trinity-s3ai)" = "https://github.com/gHashTag/trinity-s3ai"

[tool.hatch.build.targets.wheel]
packages = ["src/ncg_verifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
