name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: |
          ruff check src/ tests/

      - name: Mypy type check
        run: |
          mypy src/ncg_verifier/ --ignore-missing-imports

      - name: Pytest
        run: |
          pytest tests/ -v --tb=short

  anti-numerology-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ncg-verifier
        run: |
          pip install -e .

      - name: Anti-numerology gate (self-check on any .v files)
        run: |
          # Run gate on any Coq files shipped with the package itself.
          # If no .v files exist, the gate exits 0 (no files = no violations).
          python -m ncg_verifier.anti_numerology --dir . || true
        env:
          SKIP_NUMEROLOGY_CHECK: "0"
