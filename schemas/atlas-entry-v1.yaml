# atlas-entry-v1.yaml
# JSON Schema 2020-12 / OpenAPI 3.0 compatible
# Atlas of NCG No-Go Theorems — Entry Schema v1.0.0
#
# Source: V3_atlas_schema.md (https://github.com/gHashTag/trinity-s3ai)
# Maintained by: trinity-s3ai / open community
# License: CC-BY-4.0

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/gHashTag/ncg-verifier/schemas/atlas_entry_v1.yaml"
title: "NCG No-Go Atlas Entry"
type: object

required:
  - id
  - model_name
  - version
  - date_added
  - algebra
  - algebra_type
  - hilbert_space_description
  - dirac_operator_description
  - real_structure_J
  - grading_gamma
  - KO_dimension
  - obstruction_type
  - obstruction_statement
  - obstruction_informal
  - proof_system
  - proof_status
  - literature_citation

properties:

  # --- Identification ---

  id:
    type: string
    pattern: "^NCG-[A-Z0-9]{2,4}-[0-9]{3}$"
    description: >
      Unique atlas identifier, e.g. NCG-A4-001.
      Format: NCG-<model-class>-<NNN>.

  model_name:
    type: string
    minLength: 3
    description: "Short human-readable name for the NCG model."

  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "Semantic version of this entry, e.g. 1.0.0."

  date_added:
    type: string
    format: date
    description: "ISO-8601 date when first added to the atlas."

  date_updated:
    type: string
    format: date
    description: "ISO-8601 date of most recent update (optional)."

  maintainer:
    type: string
    description: "GitHub handle(s) or name(s) of the entry maintainer(s)."

  # --- Algebraic Data ---

  algebra:
    type: string
    description: >
      LaTeX-compatible algebra expression, e.g. M_4(C) ⊕ M_2(C) ⊕ M_3(C).
      Describes the algebra A of the finite spectral triple.

  algebra_type:
    type: string
    enum:
      - matrix_algebra
      - group_algebra
      - jordan_algebra
      - clifford_algebra
      - other
    description: "Enumerated type of the algebra."

  hilbert_space_description:
    type: string
    description: >
      Description of the Hilbert space H. Should specify dimension and
      structure explicitly.

  dirac_operator_description:
    type: string
    description: >
      Description of the Dirac operator D. Specify product type, reality,
      and equivariance constraints.

  real_structure_J:
    type: string
    description: >
      Description of the real structure J (charge conjugation / antilinear
      isometry). Must state the involution property J² = ε explicitly.

  grading_gamma:
    type: string
    description: >
      Description of the grading γ (chirality operator). For odd KO-dimension
      enter "none".

  KO_dimension:
    type: integer
    minimum: 0
    maximum: 7
    description: "KO-dimension n (mod 8) of the finite spectral triple."

  # --- Obstruction Data ---

  obstruction_type:
    oneOf:
      - type: string
        enum:
          - chirality
          - cosmology
          - mass_hierarchy
          - sigma_field
          - first_order
          - poincare_duality
          - orientability
          - fermion_doubling
          - gauge_unification
          - other
      - type: array
        items:
          type: string
          enum:
            - chirality
            - cosmology
            - mass_hierarchy
            - sigma_field
            - first_order
            - poincare_duality
            - orientability
            - fermion_doubling
            - gauge_unification
            - other
        minItems: 1
    description: "Type(s) of the obstruction. Multiple values allowed."

  obstruction_statement:
    type: string
    minLength: 50
    description: >
      Precise mathematical statement of the obstruction (theorem-level:
      quantified variables, exact conditions, exact conclusion).

  obstruction_informal:
    type: string
    minLength: 20
    description: >
      Concise informal explanation (2–5 sentences) accessible to a physicist.

  # --- Formal Proof Data ---

  proof_system:
    type: string
    enum:
      - Coq
      - Lean4
      - Agda
      - Isabelle
      - informal
      - none
    description: >
      Proof system used. Use 'informal' for mathematical but not
      machine-verified proofs. Use 'none' for candidate obstructions.

  proof_status:
    type: string
    enum:
      - formally_verified
      - partially_verified
      - informal_proof
      - candidate
      - refuted
    description: >
      Verification status of this entry.

  proof_path:
    type: string
    description: >
      Relative path within the repository to the proof file.
      Omit for candidate or informal_proof entries.

  theorem_name:
    type: string
    description: "Exact identifier of the main theorem in the proof file."

  admitted_count:
    type: integer
    minimum: 0
    description: >
      Number of Admitted or sorry lemmas in the proof dependency chain.
      Must be 0 for formally_verified entries.

  proof_notes:
    type: string
    description: "Caveats or important notes about the proof."

  # --- Literature ---

  literature_citation:
    type: array
    minItems: 0
    items:
      type: object
      required:
        - authors
        - title
        - doi_or_arxiv
        - year
        - relevance
      properties:
        authors:
          type: array
          items:
            type: string
        title:
          type: string
        doi_or_arxiv:
          type: string
        year:
          type: integer
        relevance:
          type: string
          enum:
            - main_result
            - background
            - partial_result
            - related_model
    description: "List of literature citations. At least one required (except purely new candidates)."

  comparison_with_other_atlas_entries:
    type: string
    description: >
      Comparison or cross-reference to other entries in this atlas.
      Describe relative strength of obstructions, shared algebras, etc.

  related_entries:
    type: array
    items:
      type: string
      pattern: "^NCG-[A-Z0-9]{2,4}-[0-9]{3}$"
    description: "List of related atlas entry IDs."
